[package]
name = "i_shape_ffi"
version = "0.2.4"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
#i_triangle = { version = "~0.38.0" }
i_triangle = { path = "../iTriangle/iTriangle" }

[patch.crates-io]
# Build against the compatible sibling iShape repositories so local API updates
# are picked up before their next crates.io releases. iFloat and iShape remain
# versioned dependencies until iOverlay migrates to their in-progress API.
i_key_sort = { path = "../iKeySort/iKeySort" }
i_overlay = { path = "../iOverlay/iOverlay" }
i_tree = { path = "../iTree" }
